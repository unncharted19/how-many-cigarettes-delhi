<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a0a"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Film grain -->
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.04"/>

  <!-- Left accent bar -->
  <rect x="72" y="80" width="4" height="470" fill="#dc2626" opacity="0.6" rx="2"/>

  <!-- Eyebrow -->
  <text x="96" y="118" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.14em" fill="rgba(255,255,255,0.45)" text-transform="uppercase">YOUR AIR · DELHI NCR · LIVE CPCB DATA</text>

  <!-- Hero number -->
  <text x="96" y="290" font-family="Helvetica Neue, Arial, sans-serif" font-size="220" font-weight="700" fill="#ef4444" line-height="1">12</text>

  <!-- cigarettes label -->
  <text x="106" y="358" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="400" fill="rgba(255,255,255,0.88)">cigarettes</text>

  <!-- Subline -->
  <text x="106" y="412" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.55)">in a month of breathing the air in</text>
  <text x="106" y="452" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="rgba(255,255,255,0.9)">Delhi NCR</text>

