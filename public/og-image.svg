      <rect x="2" y="0" width="18" height="8" fill="rgba(255,255,255,0.75)"/>
      <rect x="20" y="0" width="6" height="8" fill="rgba(255,255,255,0.4)"/>
    </g>
    <!-- Row 1 -->
    <use href="#cig" transform="translate(0,0)"/>
    <use href="#cig" transform="translate(36,0)"/>
    <use href="#cig" transform="translate(72,0)"/>
    <use href="#cig" transform="translate(108,0)"/>
    <use href="#cig" transform="translate(144,0)"/>
