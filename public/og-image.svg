  <!-- Footer left: PM2.5 badge -->
  <text x="96" y="558" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#ef4444">Very Poor</text>
  <text x="220" y="558" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.38)">  PM2.5 · Delhi NCR avg</text>

